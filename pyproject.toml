[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasync"
description = "Wrapper to XGen/XGen8/ComNav/Hills/Interlogix NX-595E/UltraSync ZeroWire"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Caron", email = "lead2gold@gmail.com" },
]
keywords = [
    "XGen", "XGen8", "Hills", "Aritech", "ComNav", "Interlogix",
    "UltraSync", "NX-595E", "ZeroWire", "Security Panel",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.7"

# The version is read from ultrasync/__init__.py, and the dependencies from
# requirements.txt, so each lives in one place only
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/caronc/ultrasync"
Issues = "https://github.com/caronc/ultrasync/issues"

[project.scripts]
ultrasync = "ultrasync.cli:main"

[tool.setuptools]
packages = ["ultrasync"]

[tool.setuptools.dynamic]
version = { attr = "ultrasync.__version__" }
dependencies = { file = ["requirements.txt"] }
