[tox]
envlist = test,lint
skipsdist = true

[testenv]
# Prevent random setuptools/pip breakages like
# https://github.com/pypa/setuptools/issues/1042 from breaking our builds.
setenv =
    VIRTUALENV_NO_DOWNLOAD=1
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/dev-requirements.txt

[testenv:test]
# Run the test suite and print a coverage report (uses .coveragerc)
# Extra pytest arguments can be passed after "--", for example:
#   tox -e test -- -k zerowire
commands =
    coverage erase
    coverage run -m pytest {posargs} tests
    coverage report

[testenv:lint]
commands =
    flake8 ultrasync tests --count --show-source --statistics

[testenv:build]
# Build the PyPI packages into dist/ and check them, ready for upload.
# Old build output is removed first so only this version is uploaded.
deps =
    build
    twine
commands =
    python -c "import shutil; [shutil.rmtree(d, True) for d in ('dist', 'build', 'ultrasync.egg-info')]"
    python -m build --outdir dist {toxinidir}
    twine check dist/*
